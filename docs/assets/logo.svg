    <path d="M92 48 H128" stroke="#3fb950" stroke-width="8"/>
  </g>
  <circle cx="56" cy="120" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="5.5" stroke-opacity="0.62"/>
  <circle cx="92" cy="84" r="8" fill="#0d1117" stroke="#58a6ff" stroke-width="5.5" stroke-opacity="0.62"/>
