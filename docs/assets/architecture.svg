  <title id="archTitle">TraceMend architecture</title>
  <desc id="archDesc">Two front ends (CLI and MCP server) share one service layer: trace ingestion adapters feed the analyzer and detectors, which produce reports and a fix pipeline guarded by security.py, with runs, findings, proposals and patches in a local SQLite store.</desc>
